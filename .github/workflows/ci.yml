name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Verificación de tipos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

  unit-tests:
    name: Tests unitarios
    runs-on: ubuntu-latest
    env:
      # Los tests unitarios trabajan con mocks y no deben conectarse a ninguna
      # base de datos. No se pasa DATABASE_URL para evitar impactos accidentales.
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      # Las páginas públicas usan `dynamic = 'force-dynamic'`, por lo que el
      # build no debería consultar la base de datos. No se pasa DATABASE_URL
      # para evitar lecturas accidentales de producción durante la compilación.
      # Si en el futuro se agrega SSG que requiera DB, usar una URL de staging.
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  knip:
    name: Análisis de dependencias no usadas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run knip

  e2e:
    name: Tests end-to-end y accesibilidad
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # Sharding opt-in: por defecto corre todo en un solo shard. Para partir
      # la suite, definir la repository variable E2E_SHARDS (p. ej. "[1, 2]")
      # y un par de secrets de base descartable POR SHARD
      # (E2E_DATABASE_URL_SHARD<N> / E2E_DATABASE_URL_SHARD<N>_UNPOOLED):
      # global-setup.ts trunca todas las tablas, así que dos shards sobre la
      # misma base se pisan entre sí. Criterio de N: partir cuando la suite
      # supere ~10 min de reloj; cada shard adicional necesita su propia base.
      matrix:
        shard: ${{ fromJSON(vars.E2E_SHARDS || '[1]') }}
    env:
      SHARD: ${{ matrix.shard }}
      # La base de datos para E2E ahora es una base remota de Neon descartable,
      # configurada a través de repository secrets. El nombre de la base termina
      # en _e2e para cumplir la validación de tests/e2e/global-setup.ts.
      # Con sharding, cada shard usa su propio secret; el shard 1 conserva los
      # secrets históricos E2E_DATABASE_URL / E2E_DATABASE_URL_UNPOOLED.
      DATABASE_URL: ${{ matrix.shard == 1 && secrets.E2E_DATABASE_URL || secrets[format('E2E_DATABASE_URL_SHARD{0}', matrix.shard)] }}
      DATABASE_URL_UNPOOLED: ${{ matrix.shard == 1 && secrets.E2E_DATABASE_URL_UNPOOLED || secrets[format('E2E_DATABASE_URL_SHARD{0}_UNPOOLED', matrix.shard)] }}
      NEXTAUTH_URL: http://localhost:3000
      AUTH_URL: http://localhost:3000
      BASE_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      DEFAULT_BRANCH_NAME: Sucursal CI
      STORAGE_PROVIDER: local
      LOCAL_STORAGE_PATH: tmp/e2e
      RATE_LIMIT_STORE_PROVIDER: memory
      PUBLIC_ORDER_RATE_LIMIT_STORE_PROVIDER: memory
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      E2E_ENABLE_RATE_LIMIT: true
      PUBLIC_ORDER_RATE_LIMIT_ENABLE_IN_DEV: true
      PUBLIC_ORDER_RATE_LIMIT_MAX_REQUESTS: 2
      TRUSTED_PROXY_IP_HEADER: X-Forwarded-For
      # Requerido por tests/e2e/caja-cierre-automatico.spec.ts: sin esta variable
      # el cierre automático queda deshabilitado (getAutoCloseHours() = 0).
      CAJA_AUTO_CLOSE_HOURS: "1"
      # Los helpers de E2E (tests/e2e/helpers.ts) mutan branches/cajas
      # escribiendo directo en la base, por detrás de la app: el caché de
      # servidor de src/lib/server-cache.ts no recibiría la invalidación por
      # tag y serviría datos viejos por hasta DATA_CACHE_REVALIDATE_S segundos.
      DATA_CACHE_REVALIDATE_S: "0"
      # Paridad con .env.e2e.example: el catálogo público pagina en orden
      # alfabético y el SSR de /pedido solo trae la primera página (default
      # 48); con el volumen de productos que crea la suite, los productos de
      # los tests quedaban fuera de página 1 (ningún test usa "Cargar más").
      # En CI no existe .env.e2e: estas variables deben pasarse por el job.
      NEXT_PUBLIC_CATALOG_PAGE_SIZE: "200"
      # Refresco de chat más rápido en E2E (paridad con .env.e2e.example).
      NEXT_PUBLIC_CHAT_REFRESH_INTERVAL_MS: "1000"
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Verificar secretos de E2E
        # Heredoc con delimitador quoteado: bash no expande nada del script
        # (backticks, ${}, comillas), a diferencia de node -e "..." donde
        # cualquier template literal o comilla rompe el parseo (SyntaxError /
        # bad substitution).
        run: |
          node - <<'EOF'
          const shard = process.env.SHARD || '1';
          const suffix = shard === '1' ? '' : `_SHARD${shard}`;
          const required = [
            { key: 'NEXTAUTH_SECRET', label: 'NEXTAUTH_SECRET', type: 'secret' },
            { key: 'ADMIN_USERNAME', label: 'ADMIN_USERNAME', type: 'secret o variable' },
            { key: 'ADMIN_PASSWORD', label: 'ADMIN_PASSWORD', type: 'secret' },
            { key: 'DATABASE_URL', label: `E2E_DATABASE_URL${suffix}`, type: 'secret' },
            { key: 'DATABASE_URL_UNPOOLED', label: `E2E_DATABASE_URL${suffix}_UNPOOLED`, type: 'secret' },
          ];

          let missing = false;
          for (const { key, label, type } of required) {
            const value = process.env[key];
            if (!value || value.trim() === '') {
              console.error(`::error::Falta ${label}. Configuralo como repository ${type} en GitHub Actions.`);
              missing = true;
            }
          }

          if (missing) {
            process.exit(1);
          }

          console.log('DATABASE_URL configurada para E2E.');
          EOF

      - name: Aplicar migraciones en la base E2E descartable
        run: npx drizzle-kit migrate
        timeout-minutes: 5

      - run: npx playwright install --with-deps
        timeout-minutes: 10

      - name: Ejecutar tests E2E y accesibilidad con axe-core (shard ${{ matrix.shard }})
        run: npx playwright test --shard=${{ matrix.shard }}/${{ strategy.job-total }}
        timeout-minutes: 18

      - name: Subir reporte blob del shard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report
          if-no-files-found: ignore
          retention-days: 5

  e2e-report:
    name: Reporte E2E consolidado
    runs-on: ubuntu-latest
    needs: e2e
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true
      - name: Consolidar reporte HTML
        # Si ningún shard produjo blobs (falla de infra previa a los tests),
        # merge-reports fallaría con "no input reports found" sin aportar
        # información; en ese caso se omite y el resultado queda en el job e2e.
        run: |
          if [ -n "$(find ./all-blob-reports -name '*.zip' -print -quit)" ]; then
            npx playwright merge-reports --reporter=html ./all-blob-reports
          else
            echo "Sin reportes blob para consolidar."
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          if-no-files-found: ignore
          retention-days: 14
