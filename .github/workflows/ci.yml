name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    name: Verificación de tipos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit

  unit-tests:
    name: Tests unitarios
    runs-on: ubuntu-latest
    env:
      # Los tests unitarios trabajan con mocks y no deben conectarse a ninguna
      # base de datos. No se pasa DATABASE_URL para evitar impactos accidentales.
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    env:
      # Las páginas públicas usan `dynamic = 'force-dynamic'`, por lo que el
      # build no debería consultar la base de datos. No se pasa DATABASE_URL
      # para evitar lecturas accidentales de producción durante la compilación.
      # Si en el futuro se agrega SSG que requiera DB, usar una URL de staging.
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  knip:
    name: Análisis de dependencias no usadas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run knip

  e2e:
    name: Tests end-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # La base de datos para E2E ahora es una base remota de Neon descartable,
      # configurada a través de repository secrets. El nombre de la base termina
      # en _e2e para cumplir la validación de tests/e2e/global-setup.ts.
      DATABASE_URL: ${{ secrets.E2E_DATABASE_URL }}
      DATABASE_URL_UNPOOLED: ${{ secrets.E2E_DATABASE_URL_UNPOOLED }}
      NEXTAUTH_URL: http://localhost:3000
      AUTH_URL: http://localhost:3000
      BASE_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      DEFAULT_BRANCH_NAME: Sucursal CI
      NEXT_PUBLIC_WHATSAPP_NUMBER: ${{ vars.NEXT_PUBLIC_WHATSAPP_NUMBER }}
      STORAGE_PROVIDER: local
      LOCAL_STORAGE_PATH: tmp/e2e
      RATE_LIMIT_STORE_PROVIDER: memory
      PUBLIC_ORDER_RATE_LIMIT_STORE_PROVIDER: memory
      E2E_ENABLE_RATE_LIMIT: true
      PUBLIC_ORDER_RATE_LIMIT_ENABLE_IN_DEV: true
      PUBLIC_ORDER_RATE_LIMIT_MAX_REQUESTS: 2
      TRUSTED_PROXY_IP_HEADER: X-Forwarded-For
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Verificar secretos de E2E
        run: |
          node -e "
          const required = [
            { key: 'NEXTAUTH_SECRET', label: 'NEXTAUTH_SECRET', type: 'secret' },
            { key: 'ADMIN_USERNAME', label: 'ADMIN_USERNAME', type: 'secret o variable' },
            { key: 'ADMIN_PASSWORD', label: 'ADMIN_PASSWORD', type: 'secret' },
            { key: 'DATABASE_URL', label: 'E2E_DATABASE_URL', type: 'secret' },
            { key: 'DATABASE_URL_UNPOOLED', label: 'E2E_DATABASE_URL_UNPOOLED', type: 'secret' },
          ];

          let missing = false;
          for (const { key, label, type } of required) {
            const value = process.env[key];
            if (!value || value.trim() === '') {
              console.error(\`::error::Falta \${label}. Configuralo como repository \${type} en GitHub Actions.\`);
              missing = true;
            }
          }

          if (missing) {
            process.exit(1);
          }

          console.log('DATABASE_URL configurada para E2E.');
          "

      - run: npx drizzle-kit push --force
        timeout-minutes: 5

      - run: npx playwright install --with-deps
        timeout-minutes: 10

      - run: npx playwright test --reporter=line
        timeout-minutes: 15
