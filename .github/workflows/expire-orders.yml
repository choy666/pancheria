name: Expirar pedidos pendientes

on:
  schedule:
    # Nominal cada 15 min (la cadencia real observada es mucho menor por los
    # retrasos de schedules de alta frecuencia en GitHub Actions). Los pedidos
    # pendientes expiran a la hora, así que alcanza de sobra, y reduce la
    # presión sobre el plan free de Neon (cada corrida despierta el compute).
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  expire:
    name: Llamar a /api/cron/expire-orders
    runs-on: ubuntu-latest
    steps:
      - name: Verificar CRON_SECRET
        run: |
          if [ -z "${{ secrets.CRON_SECRET }}" ]; then
            echo "::error::Falta el secret CRON_SECRET. Configuralo en GitHub Actions."
            exit 1
          fi

      - name: Verificar VERCEL_PRODUCTION_URL
        run: |
          if [ -z "${{ vars.VERCEL_PRODUCTION_URL }}" ]; then
            echo "::error::Falta la variable de repositorio VERCEL_PRODUCTION_URL. Configurala en GitHub Actions."
            exit 1
          fi

      - name: Disparar expiración de pedidos vencidos
        run: |
          DOMAIN="${{ vars.VERCEL_PRODUCTION_URL }}"
          DOMAIN="${DOMAIN#https://}"
          DOMAIN="${DOMAIN#http://}"
          DOMAIN="${DOMAIN%%/*}"
          URL="https://${DOMAIN}/api/cron/expire-orders"
          echo "Llamando a ${URL}"
          curl -sfS -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "$URL"
