# Ambiente estandarizado para el sistema de gestión de la panchería.
# Este blueprint puede usarse con:
#   devin.exe cloud drs blueprint-create --repo <owner/repo> --from-file .devin/environment.yaml
# No se incluyen secretos ni credenciales. Configúralos en el panel de secretos de Devin.

initialize:
  - name: "Instalar Node.js 20 LTS o superior"
    uses: github.com/actions/setup-node@v4
    with:
      node-version: "20"

maintenance:
  - name: "Instalar dependencias del proyecto"
    run: npm install

knowledge:
  - name: estructura
    contents: |
      Proyecto Next.js 16.3.3 con App Router, shadcn/ui, Drizzle ORM y PostgreSQL (Neon).
      - `src/app/(panel)/` — páginas del panel (administración y operador)
      - `src/app/(public)/pedido/` — rutas públicas (catálogo de pedidos `/pedido`, seguimiento y chat)
      - `src/app/(auth)/` — autenticación (`/login`)
      - `src/app/api/` — endpoints de la API (pública y del panel)
      - `src/db/` — esquema, conexión y seeds de Drizzle
      - `src/repositories/` — capa de repositorios
      - `src/application/` — servicios de aplicación (casos de uso y coordinación)
      - `src/application/services/` — casos de uso del dominio
      - `src/components/` — componentes React
      - `src/config/` — constantes de configuración (rutas, APIs, caja, paginación, videos, imágenes de productos)
      - `src/domain/` — tipos y errores de dominio
      - `src/hooks/` — hooks personalizados de React
      - `src/lib/` — utilidades (`cn`, `json`, `money`, `date`, `storage`, `branch-resolver`, etc.)
      - `src/app/(panel)/videos/` — páginas de gestión de videos
      - `src/app/api/videos/` — endpoints de subida y streaming de videos
      - `drizzle/` — migraciones generadas por Drizzle Kit
      - `.devin/informes/` — lecciones, reporte de estado vigente y guía de funcionamiento

  - name: install
    contents: npm install

  - name: lint
    contents: npm run lint

  - name: test
    contents: |
      Verificación de tipos: npx tsc --noEmit
      Tests unitarios: npm test
      Tests end-to-end: npm run test:e2e (equivale a `npx playwright test`)

  - name: build
    contents: |
      npm run build

  - name: e2e
    contents: |
      `npx playwright test` ejecuta `tests/e2e/global-setup.ts`, que trunca las tablas `products`, `recipes`, `sales`, `sale_items`, `orders`, `order_items`, `order_messages`, `stock_movements`, `cash_registers`, `daily_closures`, `public_order_rate_limits`, `login_attempts`, `videos`, `users` y `branches`, y re-seedea la base. No usar en producción.

  - name: database
    contents: |
      1. Copiar `.env.example` a `.env.local` y completar las variables.
      2. `DATABASE_URL` se usa en runtime; si no está definida se resuelve desde `POSTGRES_URL` o `POSTGRES_PRISMA_URL`.
      3. `DATABASE_URL_UNPOOLED` (o `POSTGRES_URL_NON_POOLING`) se usa para migraciones con `drizzle-kit`.
      4. `NEXTAUTH_URL` es la URL base de la app; `AUTH_URL` (opcional) tiene prioridad sobre `NEXTAUTH_URL` en NextAuth v5; `NEXT_PUBLIC_APP_URL` (opcional) tiene prioridad sobre `NEXTAUTH_URL` para construir URLs locales de videos y adjuntos de chat (`STORAGE_PROVIDER=local`).
      5. Generar migraciones: npx drizzle-kit generate
      6. Empujar migraciones: npx drizzle-kit push
      7. Ejecutar seed (administrador y catálogo inicial): npx tsx src/db/seeds.ts
      8. Variables de entorno usadas por el seed: `DEFAULT_BRANCH_NAME`, `DEFAULT_BRANCH_ADDRESS`, `DEFAULT_BRANCH_PHONE`, `DEFAULT_BRANCH_LOCATION`, `ADMIN_USERNAME`, `ADMIN_PASSWORD`; opcionalmente `NEW_BRANCH_NAME`, `NEW_BRANCH_USERNAME`, `NEW_BRANCH_PASSWORD`, `NEW_BRANCH_ADDRESS`, `NEW_BRANCH_PHONE`, `NEW_BRANCH_LOCATION` para crear una segunda sucursal y usuario.
      9. El esquema incluye `orders`, `order_items` y `order_messages` para pedidos públicos y chat.
      10. El esquema incluye la tabla `videos` para contenido audiovisual, `login_attempts` para rate limiting de login y `public_order_rate_limits` para rate limiting de pedidos/chat en base de datos.
      11. Variables de caja: `NEXT_PUBLIC_CAJA_REFRESH_INTERVAL_MS` (5000 ms), `CAJA_AUTO_CLOSE_HOURS`/`NEXT_PUBLIC_CAJA_AUTO_CLOSE_HOURS` (12 h), `CAJA_AUTO_CLOSED_BY`, `NEXT_PUBLIC_CAJA_CLOCK_INTERVAL_MS` (60000 ms), `CAJA_DEFAULT_HISTORY_DAYS`/`NEXT_PUBLIC_CAJA_DEFAULT_HISTORY_DAYS` (30 días).
      12. Variables del catálogo, pedidos, chat y dashboard: `NEXT_PUBLIC_WHATSAPP_NUMBER`, `NEXT_PUBLIC_WHATSAPP_MESSAGE_GREETING`, `NEXT_PUBLIC_WHATSAPP_MESSAGE_CLOSING`, `NEXT_PUBLIC_PEDIDO_REFETCH_INTERVAL_MS`, `NEXT_PUBLIC_PEDIDOS_REFRESH_INTERVAL_MS` (deshabilitado por defecto; valor mayor a 0 habilita el polling automático del panel de pedidos), `NEXT_PUBLIC_DASHBOARD_REFRESH_INTERVAL_MS` (intervalo del panel de control, por defecto 30000 ms), `NEXT_PUBLIC_API_TIMEOUT_MS`, `NEXT_PUBLIC_CHAT_REFRESH_INTERVAL_MS`, `NEXT_PUBLIC_CHAT_MAX_TEXT_LENGTH`, `NEXT_PUBLIC_CHAT_PAGE_SIZE`, `NEXT_PUBLIC_CHAT_IMAGE_MAX_SIZE_MB`, `NEXT_PUBLIC_CHAT_ALLOWED_IMAGE_MIME_TYPES`, `PUBLIC_CHAT_RATE_LIMIT_WINDOW_MS`, `PUBLIC_CHAT_RATE_LIMIT_MAX_REQUESTS`, `PUBLIC_ORDER_RATE_LIMIT_STORE_PROVIDER`, `PUBLIC_ORDER_RATE_LIMIT_WINDOW_MS`, `PUBLIC_ORDER_RATE_LIMIT_MAX_REQUESTS`, `PUBLIC_ORDER_RATE_LIMIT_ENABLE_IN_DEV` (activa el rate limit en desarrollo), `E2E_ENABLE_RATE_LIMIT` (activa el rate limit en tests E2E), `ORDER_EXPIRATION_MS`, `CRON_SECRET`, `TRUSTED_PROXY_IP_HEADER`, `LOCAL_STORAGE_PATH` y `CHAT_LOCAL_STORAGE_PATH`.
      13. `RATE_LIMIT_STORE_PROVIDER` (opcional) controla dónde se almacenan los intentos fallidos de login: `memory` en desarrollo/test, `db` por defecto en producción si hay base de datos, o explícito con `RATE_LIMIT_STORE_PROVIDER=db`.
      14. Variables de videos, imágenes de productos y almacenamiento: `NEXT_PUBLIC_APP_URL`, `NEXT_PUBLIC_CAST_RECEIVER_APP_ID`, `NEXT_PUBLIC_CAST_SENDER_SDK_URL`, `NEXT_PUBLIC_VIDEO_MAX_SIZE_MB`, `NEXT_PUBLIC_VIDEO_ALLOWED_MIME_TYPES`, `STORAGE_PROVIDER`, `BLOB_READ_WRITE_TOKEN`, `S3_*`, `R2_*`, `LOCAL_STORAGE_PATH`, `CHAT_LOCAL_STORAGE_PATH`, `NEXT_PUBLIC_ENABLE_VERCEL_ANALYTICS`, `NEXT_PUBLIC_PRODUCT_IMAGE_MAX_SIZE_MB`, `NEXT_PUBLIC_PRODUCT_IMAGE_ALLOWED_MIME_TYPES`, `PRODUCT_IMAGE_LOCAL_STORAGE_PATH`, `PRODUCT_IMAGE_ALLOWED_EXTERNAL_DOMAINS`, `NEXT_PUBLIC_PRODUCT_IMAGE_URL_MAX_LENGTH`.
      15. Los productos/promos pueden tener una imagen ilustrativa (`products.image_url`, `image_key`, `image_mime_type`, `image_size`) que se muestra en el catálogo público. La subida se hace por `POST /api/productos/imagen/preparar` (instrucciones) y `POST /api/productos/imagen/upload` (solo `local`), y se sirve por `GET /api/productos/imagen/[key]`.
      16. Los cron jobs (`/api/cron/rate-limit-cleanup` y `/api/cron/chat-attachments-cleanup`) se configuran en `vercel.json` (`0 0 * * *` por defecto); Vercel Cron Jobs no leen variables de entorno para el `schedule`.
      17. Los valores sensibles deben provenir de variables de entorno, nunca hardcodeados.
      18. Variables adicionales: `BASE_URL` (URL base para Playwright; por defecto `http://localhost:3000`), `E2E_ENABLE_RATE_LIMIT` (activa rate limit en tests E2E), `NO_WEB_SERVER` y `NO_GLOBAL_SETUP` (para correr Playwright manualmente), `ANALYZE` (habilita el analizador de bundle en `npm run analyze`).

  - name: pedidos
    contents: |
      Catálogo público, pedidos y chat:
      - Ruta pública `/pedido` para armar carrito y hacer el pedido desde la app.
      - Si `NEXT_PUBLIC_WHATSAPP_NUMBER` está configurado, el pedido también genera un enlace de WhatsApp como fallback.
      - El cliente puede coordinar con la sucursal por el chat `/pedido/[id]/chat?token=...`, con texto e imágenes.
      - Panel `/pedidos` para listar, confirmar o cancelar pedidos; al listar se expiran automáticamente los pedidos `pending` cuyo `createdAt` supere `ORDER_EXPIRATION_MS`; el listado hace polling automático solo si `NEXT_PUBLIC_PEDIDOS_REFRESH_INTERVAL_MS` es mayor a 0 (deshabilitado por defecto) e incluye un botón de actualización manual; muestra `unreadCount`.
      - El stock se valida al crear el pedido y se descuenta únicamente al confirmar desde el panel; la cancelación o expiración no modifica stock.
      - Variables de entorno: `NEXT_PUBLIC_WHATSAPP_NUMBER`, `NEXT_PUBLIC_WHATSAPP_MESSAGE_GREETING`, `NEXT_PUBLIC_WHATSAPP_MESSAGE_CLOSING`, `NEXT_PUBLIC_PEDIDO_REFETCH_INTERVAL_MS`, `NEXT_PUBLIC_PEDIDOS_REFRESH_INTERVAL_MS` (deshabilitado por defecto; valor mayor a 0 habilita el polling automático del panel de pedidos), `NEXT_PUBLIC_DASHBOARD_REFRESH_INTERVAL_MS` (intervalo del panel de control, por defecto 30000 ms), `NEXT_PUBLIC_API_TIMEOUT_MS`, `NEXT_PUBLIC_CHAT_REFRESH_INTERVAL_MS`, `NEXT_PUBLIC_CHAT_MAX_TEXT_LENGTH`, `NEXT_PUBLIC_CHAT_PAGE_SIZE`, `NEXT_PUBLIC_CHAT_IMAGE_MAX_SIZE_MB`, `NEXT_PUBLIC_CHAT_ALLOWED_IMAGE_MIME_TYPES`, `PUBLIC_CHAT_RATE_LIMIT_WINDOW_MS`, `PUBLIC_CHAT_RATE_LIMIT_MAX_REQUESTS`, `PUBLIC_ORDER_RATE_LIMIT_STORE_PROVIDER`, `PUBLIC_ORDER_RATE_LIMIT_WINDOW_MS`, `PUBLIC_ORDER_RATE_LIMIT_MAX_REQUESTS`, `PUBLIC_ORDER_RATE_LIMIT_ENABLE_IN_DEV` (activa el rate limit en desarrollo), `E2E_ENABLE_RATE_LIMIT` (activa el rate limit en tests E2E), `ORDER_EXPIRATION_MS`, `CRON_SECRET`, `TRUSTED_PROXY_IP_HEADER`, `LOCAL_STORAGE_PATH`, `CHAT_LOCAL_STORAGE_PATH`.

  - name: videos
    contents: |
      Videos, reproducción y Cast:
      - Rutas del panel: `/videos`, `/videos/nuevo`, `/videos/[id]`.
      - Endpoints: `POST /api/videos/upload`, `GET /api/videos/[id]/stream`.
      - Tabla `videos` en `src/db/schema.ts` con metadatos, URL pública, tipo MIME, tamaño y soft delete.
      - `src/lib/storage.ts` soporta proveedores `local`, `vercel-blob`, `s3` y `r2`.
      - `src/config/videos.ts` define tamaño máximo, tipos MIME, Cast receiver/sender y selector de proveedor.
      - `STORAGE_PROVIDER` también se usa para los adjuntos de chat e imágenes de productos; `LOCAL_STORAGE_PATH` es la ruta base, `CHAT_LOCAL_STORAGE_PATH` (opcional) la específica para chat y `PRODUCT_IMAGE_LOCAL_STORAGE_PATH` (opcional) la específica para imágenes de productos.
      - Variables de entorno: `NEXT_PUBLIC_APP_URL`, `STORAGE_PROVIDER`, `BLOB_READ_WRITE_TOKEN`, `S3_*`, `R2_*`, `LOCAL_STORAGE_PATH`, `CHAT_LOCAL_STORAGE_PATH`, `NEXT_PUBLIC_VIDEO_MAX_SIZE_MB`, `NEXT_PUBLIC_VIDEO_ALLOWED_MIME_TYPES`, `NEXT_PUBLIC_CAST_RECEIVER_APP_ID`, `NEXT_PUBLIC_CAST_SENDER_SDK_URL`, `NEXT_PUBLIC_ENABLE_VERCEL_ANALYTICS`.

  - name: panel
    contents: |
      Panel de control (`/` autenticado):
      - `src/app/(panel)/page.tsx` renderiza `src/components/panel/dashboard-client.tsx`.
      - El dashboard carga `GET /api/panel/resumen` a través de `src/hooks/useDashboard.ts` (refresco automático cada 30 segundos).
      - Muestra estado de caja, pedidos por estado, alertas de stock bajo, contexto de sucursal y accesos rápidos filtrados por rol.
      - La navegación distingue `Historial de cajas`, `Caja y cierre` y `Cierres diarios`.
      - El tour (`src/components/tour/tour-context.tsx`) cubre panel, pagos mixtos, pedidos, reservas, chat, imágenes de promos, videos, perfil y selector de sucursal.

  - name: deploy
    contents: |
      Despliegue en Vercel:
      1. Configurar `DATABASE_URL` (o `POSTGRES_URL`/`POSTGRES_PRISMA_URL`), `DATABASE_URL_UNPOOLED` (o `POSTGRES_URL_NON_POOLING`), `NEXTAUTH_URL`, `AUTH_URL` (opcional, prioridad sobre `NEXTAUTH_URL` en NextAuth v5), `NEXT_PUBLIC_APP_URL` (opcional, para URLs locales de videos, adjuntos de chat e imágenes de productos), `NEXTAUTH_SECRET`, `ADMIN_USERNAME`, `ADMIN_PASSWORD`, `DEFAULT_BRANCH_NAME`, `NEXT_PUBLIC_CAJA_REFRESH_INTERVAL_MS`, `NEXT_PUBLIC_CAJA_AUTO_CLOSE_HOURS`, `NEXT_PUBLIC_CAJA_DEFAULT_HISTORY_DAYS`, `NEXT_PUBLIC_WHATSAPP_NUMBER`, `NEXT_PUBLIC_WHATSAPP_MESSAGE_GREETING`, `NEXT_PUBLIC_WHATSAPP_MESSAGE_CLOSING`, `NEXT_PUBLIC_PEDIDO_REFETCH_INTERVAL_MS`, `NEXT_PUBLIC_PEDIDOS_REFRESH_INTERVAL_MS`, `NEXT_PUBLIC_DASHBOARD_REFRESH_INTERVAL_MS`, `NEXT_PUBLIC_CHAT_REFRESH_INTERVAL_MS`, `NEXT_PUBLIC_CHAT_MAX_TEXT_LENGTH`, `NEXT_PUBLIC_CHAT_PAGE_SIZE`, `NEXT_PUBLIC_CHAT_IMAGE_MAX_SIZE_MB`, `NEXT_PUBLIC_CHAT_ALLOWED_IMAGE_MIME_TYPES`, `PUBLIC_CHAT_RATE_LIMIT_WINDOW_MS`, `PUBLIC_CHAT_RATE_LIMIT_MAX_REQUESTS`, `PUBLIC_ORDER_RATE_LIMIT_STORE_PROVIDER`, `PUBLIC_ORDER_RATE_LIMIT_WINDOW_MS`, `PUBLIC_ORDER_RATE_LIMIT_MAX_REQUESTS`, `PUBLIC_ORDER_RATE_LIMIT_ENABLE_IN_DEV`, `E2E_ENABLE_RATE_LIMIT`, `CRON_SECRET`, `ORDER_EXPIRATION_MS`, `RATE_LIMIT_STORE_PROVIDER`, `TRUSTED_PROXY_IP_HEADER`, `NEXT_PUBLIC_API_TIMEOUT_MS`, `NEXT_PUBLIC_CAST_RECEIVER_APP_ID`, `NEXT_PUBLIC_CAST_SENDER_SDK_URL`, `NEXT_PUBLIC_VIDEO_MAX_SIZE_MB`, `NEXT_PUBLIC_VIDEO_ALLOWED_MIME_TYPES`, `STORAGE_PROVIDER`, `NEXT_PUBLIC_ENABLE_VERCEL_ANALYTICS` y las credenciales del proveedor elegido (`BLOB_READ_WRITE_TOKEN`, `S3_*`, `R2_*`, `LOCAL_STORAGE_PATH`, `CHAT_LOCAL_STORAGE_PATH`, `NEXT_PUBLIC_PRODUCT_IMAGE_MAX_SIZE_MB`, `NEXT_PUBLIC_PRODUCT_IMAGE_ALLOWED_MIME_TYPES`, `PRODUCT_IMAGE_LOCAL_STORAGE_PATH`, `PRODUCT_IMAGE_ALLOWED_EXTERNAL_DOMAINS`, `NEXT_PUBLIC_PRODUCT_IMAGE_URL_MAX_LENGTH`, `NEXT_PUBLIC_PAYMENT_DENOMINATIONS`) en Vercel.
      2. Ejecutar `npx drizzle-kit push` y `npx tsx src/db/seeds.ts` en producción.
      3. Redeployar con `vercel --prod` para que las variables formen parte del build.
      4. Verificar en `vercel inspect <url>` que `Builds` contenga funciones serverless (`λ`); si aparece `Framework Preset: Other`, el proyecto no detectó Next.js.
      5. Si la URL muestra el login de Vercel, deshabilitar `Settings → Deployment Protection → Vercel Authentication`.
      6. `NEXTAUTH_URL` debe coincidir con el dominio de producción asignado.

  - name: start
    contents: |
      npm run dev
      La aplicación se ejecutará en http://localhost:3000

  - name: informes
    contents: |
      Directorio `.devin/informes/`:
      - `lecciones-aprendidas.md` — resumen transversal de lecciones para prompts y auditorías.
      - `reporte-estado.md` — informe de estado vigente (único; no duplicar con archivos `reporte-estado-YYYY-MM-DD.md` salvo que se archiven).
      - `guia-funcionamiento-pancheria.md` — conceptos de negocio, roles, flujos y decisiones arquitectónicas.
      - `archivados/` — reportes históricos.
      Antes de iniciar auditorías, refactorización, integridad de datos, configuración de entorno o creación de prompts, consultar estos archivos y `.devin/prompts/README.md`.

  - name: knip
    contents: |
      `npm run knip` detecta exports, dependencias y archivos no usados.
      - Los falsos positivos de `shadcn/ui` y scripts como `src/db/seeds.ts` deben ignorarse en `knip.json`.
      - Ejecutar periódicamente para detectar código muerto real.

  - name: e2e
    contents: |
      Tests end-to-end con Playwright.
      - `npm run test:e2e` equivale a `npx playwright test`.
      - Requiere `.env.e2e` con `DATABASE_URL` apuntando a una base de datos descartable.
      - `tests/e2e/global-setup.ts` trunca tablas y re-seedea; nunca correr contra producción.
      - `playwright.config.ts` levanta `npm run dev:e2e` y espera `/api/caja/resumen` para forzar compilación de API.
      - Para levantar manualmente: `npm run dev:e2e` y `NO_WEB_SERVER=1 npx playwright test`.
