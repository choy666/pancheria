# Ambiente estandarizado para el sistema de gestión de la panchería.
# Este blueprint puede usarse con:
#   devin.exe cloud drs blueprint-create --repo <owner/repo> --from-file .devin/environment.yaml
# No se incluyen secretos ni credenciales. Configúralos en el panel de secretos de Devin.

initialize:
  - name: "Instalar Node.js 20 LTS"
    uses: github.com/actions/setup-node@v4
    with:
      node-version: "20"

maintenance:
  - name: "Instalar dependencias del proyecto"
    run: npm install

knowledge:
  - name: estructura
    contents: |
      Proyecto Next.js 16 con App Router, shadcn/ui, Drizzle ORM y PostgreSQL (Neon).
      - `src/app/(panel)/` — páginas del panel (administración y operador)
      - `src/app/(public)/` — rutas públicas (catálogo de pedidos `/pedido`)
      - `src/app/(auth)/` — autenticación (`/login`)
      - `src/app/api/` — endpoints de la API (pública y del panel)
      - `src/db/` — esquema, conexión y seeds de Drizzle
      - `src/repositories/` — capa de repositorios
      - `src/application/` — servicios de aplicación (casos de uso y coordinación)
      - `src/application/services/` — casos de uso del dominio
      - `src/components/` — componentes React
      - `src/config/` — constantes de configuración (rutas, APIs, caja, paginación, videos)
      - `src/domain/` — tipos y errores de dominio
      - `src/hooks/` — hooks personalizados de React
      - `src/lib/` — utilidades (`cn`, `json`, `money`, `date`, `storage`, `branch-resolver`, etc.)
      - `src/app/(panel)/videos/` — páginas de gestión de videos
      - `src/app/api/videos/` — endpoints de subida y streaming de videos
      - `drizzle/` — migraciones generadas por Drizzle Kit
      - `.devin/informes/` — lecciones, reporte de estado vigente y guía de funcionamiento

  - name: install
    contents: npm install

  - name: lint
    contents: npm run lint

  - name: test
    contents: |
      Verificación de tipos: npx tsc --noEmit
      Tests unitarios: npm test
      Tests end-to-end: npm run test:e2e (equivale a `npx playwright test`)

  - name: build
    contents: |
      npm run build

  - name: e2e
    contents: |
      `npx playwright test` ejecuta `tests/e2e/global-setup.ts`, que trunca las tablas `products`, `recipes`, `sales`, `sale_items`, `orders`, `order_items`, `stock_movements`, `cash_registers`, `daily_closures`, `public_order_rate_limits`, `videos`, `login_attempts`, `users` y `branches`, y re-seedea la base. No usar en producción.

  - name: database
    contents: |
      1. Copiar `.env.example` a `.env.local` y completar las variables.
      2. `DATABASE_URL` se usa en runtime; si no está definida se resuelve desde `POSTGRES_URL` o `POSTGRES_PRISMA_URL`.
      3. `DATABASE_URL_UNPOOLED` (o `POSTGRES_URL_NON_POOLING`) se usa para migraciones con `drizzle-kit`.
      - `NEXTAUTH_URL` es la URL base de la app; `NEXT_PUBLIC_APP_URL` (opcional) tiene prioridad sobre `NEXTAUTH_URL` para construir URLs locales de videos (`STORAGE_PROVIDER=local`).
      4. Generar migraciones: npx drizzle-kit generate
      5. Empujar migraciones: npx drizzle-kit push
      6. Ejecutar seed (administrador y catálogo inicial): npx tsx src/db/seeds.ts
      7. Variables de entorno usadas por el seed: `DEFAULT_BRANCH_NAME`, `ADMIN_USERNAME`, `ADMIN_PASSWORD`; opcionalmente `NEW_BRANCH_NAME`, `NEW_BRANCH_USERNAME`, `NEW_BRANCH_PASSWORD` para crear una segunda sucursal y usuario.
      8. El esquema incluye las tablas `orders` e `order_items` para pedidos públicos.
      9. El esquema incluye la tabla `videos` para contenido audiovisual y `login_attempts` para rate limiting de login en base de datos.
      10. `NEXT_PUBLIC_CAJA_REFRESH_INTERVAL_MS` controla el intervalo de refresco del panel de caja (por defecto 5000 ms).
      11. `NEXT_PUBLIC_WHATSAPP_NUMBER`, `NEXT_PUBLIC_WHATSAPP_MESSAGE_GREETING`, `NEXT_PUBLIC_WHATSAPP_MESSAGE_CLOSING`, `NEXT_PUBLIC_PEDIDO_REFETCH_INTERVAL_MS`, `PUBLIC_ORDER_RATE_LIMIT_WINDOW_MS` y `PUBLIC_ORDER_RATE_LIMIT_MAX_REQUESTS` configuran el catálogo y pedidos.
      12. `ORDER_EXPIRATION_MS` (opcional) — milisegundos antes de que un pedido `pending` se marque como cancelado (por defecto 3600000 ms = 1 hora; mínimo 60000 ms). No libera stock; limpia pedidos viejos del panel al listar.
      13. `RATE_LIMIT_STORE_PROVIDER` (opcional) controla dónde se almacenan los intentos fallidos de login: `memory` en desarrollo/test, `db` por defecto en producción si hay base de datos, o explícito con `RATE_LIMIT_STORE_PROVIDER=db`.
      14. Variables de videos y almacenamiento: `NEXT_PUBLIC_APP_URL`, `NEXT_PUBLIC_CAST_RECEIVER_APP_ID`, `NEXT_PUBLIC_CAST_SENDER_SDK_URL`, `NEXT_PUBLIC_VIDEO_MAX_SIZE_MB`, `NEXT_PUBLIC_VIDEO_ALLOWED_MIME_TYPES`, `STORAGE_PROVIDER`, `BLOB_READ_WRITE_TOKEN`, `S3_*`, `R2_*`, `LOCAL_STORAGE_PATH`.
      15. Los valores sensibles deben provenir de variables de entorno, nunca hardcodeados.

  - name: pedidos
    contents: |
      Catálogo público y pedidos:
      - Ruta pública `/pedido` para armar carrito y enviar pedido por WhatsApp.
      - Panel `/pedidos` para listar, confirmar o cancelar pedidos; al listar se expiran automáticamente los pedidos `pending` cuyo `createdAt` supere `ORDER_EXPIRATION_MS`.
      - El stock se valida al crear el pedido y se descuenta únicamente al confirmar desde el panel; la cancelación o expiración no modifica stock.
      - Variables de entorno: `NEXT_PUBLIC_WHATSAPP_NUMBER`, `NEXT_PUBLIC_WHATSAPP_MESSAGE_GREETING`, `NEXT_PUBLIC_WHATSAPP_MESSAGE_CLOSING`, `NEXT_PUBLIC_PEDIDO_REFETCH_INTERVAL_MS`, `PUBLIC_ORDER_RATE_LIMIT_WINDOW_MS`, `PUBLIC_ORDER_RATE_LIMIT_MAX_REQUESTS`, `ORDER_EXPIRATION_MS`.

  - name: videos
    contents: |
      Videos, reproducción y Cast:
      - Rutas del panel: `/videos`, `/videos/nuevo`, `/videos/[id]`.
      - Endpoints: `POST /api/videos/upload`, `GET /api/videos/[id]/stream`.
      - Tabla `videos` en `src/db/schema.ts` con metadatos, URL pública, tipo MIME, tamaño y soft delete.
      - `src/lib/storage.ts` soporta proveedores `local`, `vercel-blob`, `s3` y `r2`.
      - `src/config/videos.ts` define tamaño máximo, tipos MIME, Cast receiver/sender y selector de proveedor.
      - Variables de entorno: `NEXT_PUBLIC_APP_URL`, `STORAGE_PROVIDER`, `BLOB_READ_WRITE_TOKEN`, `S3_*`, `R2_*`, `LOCAL_STORAGE_PATH`, `NEXT_PUBLIC_VIDEO_MAX_SIZE_MB`, `NEXT_PUBLIC_VIDEO_ALLOWED_MIME_TYPES`, `NEXT_PUBLIC_CAST_RECEIVER_APP_ID`, `NEXT_PUBLIC_CAST_SENDER_SDK_URL`.

  - name: deploy
    contents: |
      Despliegue en Vercel:
      1. Configurar `DATABASE_URL` (o `POSTGRES_URL`), `DATABASE_URL_UNPOOLED` (o `POSTGRES_URL_NON_POOLING`), `NEXTAUTH_URL`, `NEXT_PUBLIC_APP_URL` (opcional, para URLs de videos en modo local), `NEXTAUTH_SECRET`, `ADMIN_USERNAME`, `ADMIN_PASSWORD`, `DEFAULT_BRANCH_NAME`, `NEXT_PUBLIC_CAJA_REFRESH_INTERVAL_MS`, `NEXT_PUBLIC_WHATSAPP_NUMBER`, `NEXT_PUBLIC_WHATSAPP_MESSAGE_GREETING`, `NEXT_PUBLIC_WHATSAPP_MESSAGE_CLOSING`, `NEXT_PUBLIC_PEDIDO_REFETCH_INTERVAL_MS`, `PUBLIC_ORDER_RATE_LIMIT_WINDOW_MS`, `PUBLIC_ORDER_RATE_LIMIT_MAX_REQUESTS`, `RATE_LIMIT_STORE_PROVIDER`, `NEXT_PUBLIC_CAST_RECEIVER_APP_ID`, `NEXT_PUBLIC_CAST_SENDER_SDK_URL`, `NEXT_PUBLIC_VIDEO_MAX_SIZE_MB`, `NEXT_PUBLIC_VIDEO_ALLOWED_MIME_TYPES`, `STORAGE_PROVIDER` y las credenciales del proveedor de videos elegido (`BLOB_READ_WRITE_TOKEN`, `S3_*`, `R2_*`, `LOCAL_STORAGE_PATH`) en Vercel.
      2. Ejecutar `npx drizzle-kit push` y `npx tsx src/db/seeds.ts` en producción.
      3. Redeployar con `vercel --prod` para que las variables formen parte del build.
      4. Verificar en `vercel inspect <url>` que `Builds` contenga funciones serverless (`λ`); si aparece `Framework Preset: Other`, el proyecto no detectó Next.js.
      5. Si la URL muestra el login de Vercel, deshabilitar `Settings → Deployment Protection → Vercel Authentication`.
      6. `NEXTAUTH_URL` debe coincidir con el dominio de producción asignado.

  - name: start
    contents: |
      npm run dev
      La aplicación se ejecutará en http://localhost:3000

  - name: informes
    contents: |
      Directorio `.devin/informes/`:
      - `lecciones-aprendidas.md` — resumen transversal de lecciones para prompts y auditorías.
      - `reporte-estado.md` — informe de estado vigente (único; no duplicar con archivos `reporte-estado-YYYY-MM-DD.md` salvo que se archiven).
      - `guia-funcionamiento-pancheria.md` — conceptos de negocio, roles, flujos y decisiones arquitectónicas.
      - `archivados/` — reportes históricos.
      Antes de iniciar auditorías, refactorización, integridad de datos, configuración de entorno o creación de prompts, consultar estos archivos y `.devin/prompts/README.md`.
