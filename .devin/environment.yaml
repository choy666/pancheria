# Ambiente estandarizado para el sistema de gestión de la panchería.
# Este blueprint puede usarse con:
#   devin.exe cloud drs blueprint-create --repo <owner/repo> --from-file .devin/environment.yaml
# No se incluyen secretos ni credenciales. Configúralos en el panel de secretos de Devin.

initialize:
  - name: "Instalar Node.js 20 LTS"
    uses: github.com/actions/setup-node@v4
    with:
      node-version: "20"

maintenance:
  - name: "Instalar dependencias del proyecto"
    run: npm install

knowledge:
  - name: estructura
    contents: |
      Proyecto Next.js 16 con App Router, shadcn/ui, Drizzle ORM y PostgreSQL (Neon).
      - `src/app/` — rutas y páginas del panel/administración
      - `src/app/api/` — endpoints de la API
      - `src/db/` — esquema, conexión y seeds de Drizzle
      - `src/repositories/` — capa de repositorios
      - `src/application/services/` — servicios de aplicación
      - `src/components/` — componentes React
      - `drizzle/` — migraciones generadas por Drizzle Kit

  - name: install
    contents: npm install

  - name: lint
    contents: npm run lint

  - name: test
    contents: |
      Tests unitarios: npm test
      Tests end-to-end: npx playwright test

  - name: build
    contents: |
      npm run build

  - name: e2e
    contents: |
      `npx playwright test` ejecuta `tests/e2e/global-setup.ts`, que trunca las tablas de negocio y re-seedea la base. No usar en producción.

  - name: database
    contents: |
      1. Copiar `.env.example` a `.env.local` y completar las variables.
      2. `DATABASE_URL` se usa en runtime; si no está definida se resuelve desde `POSTGRES_URL` o `POSTGRES_PRISMA_URL`.
      3. `DATABASE_URL_UNPOOLED` (o `POSTGRES_URL_NON_POOLING`) se usa para migraciones con `drizzle-kit`.
      4. Generar/empujar migraciones: npx drizzle-kit push
      5. Ejecutar seed de administrador: npx tsx src/db/seeds.ts
      6. Los valores sensibles deben provenir de variables de entorno, nunca hardcodeados.

  - name: start
    contents: |
      npm run dev
      La aplicación se ejecutará en http://localhost:3000

  - name: informes
    contents: |
      Consultar .devin/informes/lecciones-aprendidas.md para lecciones aprendidas y .devin/prompts/README.md para la guía de escritura de prompts antes de iniciar tareas de auditoría, refactorización, integridad de datos, configuración de entorno o creación de prompts.
